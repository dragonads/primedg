<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Official Community</title>

<meta name="description"
content="Join the official community for the latest updates and exclusive content.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#030405;
    color:#f5f8fc;
    font-family:"Inter",sans-serif;
    overflow-x:hidden;
}

:root{
    --bg:#030405;
    --bg2:#070a0f;

    --white:#f5f8fc;
    --muted:#7d8795;
    --dim:#4f5967;

    --cyan:#59ddff;
    --blue:#378cff;
    --violet:#786cff;

    --line:rgba(255,255,255,.075);
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(44,157,255,.16),
            transparent 30%
        ),
        radial-gradient(
            circle at 100% 45%,
            rgba(100,82,255,.08),
            transparent 28%
        ),
        radial-gradient(
            circle at 0% 80%,
            rgba(0,208,255,.06),
            transparent 25%
        );
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-4;
    pointer-events:none;

    background:
        linear-gradient(
            rgba(255,255,255,.012) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.012) 1px,
            transparent 1px
        );

    background-size:50px 50px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 90%
        );
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:min(100%,620px);
    margin:auto;
    padding:0 16px;
}


/* =====================================================
   HEADER
===================================================== */

header{
    height:76px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    position:relative;
    z-index:20;
}

.logo-name{
    display:flex;
    align-items:center;
    gap:9px;

    font-size:10px;
    font-weight:700;

    letter-spacing:1.8px;
    text-transform:uppercase;

    color:#c0c8d3;
}

.logo-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--cyan);

    box-shadow:
        0 0 14px var(--cyan);
}

.header-button{
    padding:8px 13px;

    border:1px solid var(--line);

    border-radius:100px;

    color:#768291;

    font-size:8px;

    text-decoration:none;

    text-transform:uppercase;

    letter-spacing:1px;

    background:
        rgba(255,255,255,.025);

    backdrop-filter:blur(15px);
}


/* =====================================================
   HERO
===================================================== */

.hero{
    position:relative;

    min-height:760px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:60px 0 70px;
}

.hero-glow{
    position:absolute;

    width:380px;
    height:380px;

    left:50%;
    top:45%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(47,177,255,.12),
            transparent 68%
        );

    pointer-events:none;
}


/* =====================================================
   LOGO
===================================================== */

.logo-box{
    position:relative;

    width:142px;
    height:142px;

    display:grid;
    place-items:center;

    margin-bottom:32px;
}

.logo-ring{
    position:absolute;
    inset:0;

    border-radius:50%;

    background:
        conic-gradient(
            from 20deg,
            transparent 0deg,
            rgba(87,218,255,.9) 70deg,
            transparent 125deg,
            rgba(113,105,255,.75) 220deg,
            transparent 290deg
        );

    animation:spin 9s linear infinite;

    filter:
        drop-shadow(
            0 0 18px
            rgba(76,202,255,.18)
        );
}

.logo-ring::after{
    content:"";

    position:absolute;

    inset:2px;

    border-radius:50%;

    background:#030507;
}

.logo{
    position:relative;

    z-index:3;

    width:112px;
    height:112px;

    border-radius:50%;

    object-fit:cover;

    background:#080b10;

    border:
        4px solid
        #06080c;

    box-shadow:
        0 25px 80px rgba(0,0,0,.65),
        0 0 50px rgba(65,190,255,.14);
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =====================================================
   BADGE
===================================================== */

.badge{
    display:inline-flex;
    align-items:center;
    gap:7px;

    padding:8px 13px;

    border-radius:100px;

    border:
        1px solid
        rgba(87,218,255,.14);

    background:
        rgba(87,218,255,.035);

    color:#8de7ff;

    font-size:8px;
    font-weight:700;

    letter-spacing:1.7px;

    text-transform:uppercase;

    margin-bottom:20px;
}

.badge i{
    width:5px;
    height:5px;

    border-radius:50%;

    background:var(--cyan);

    box-shadow:
        0 0 10px var(--cyan);
}


/* =====================================================
   HERO TITLE
===================================================== */

.hero h1{
    position:relative;
    z-index:2;

    font-family:"Space Grotesk",sans-serif;

    font-size:
        clamp(
            45px,
            13vw,
            72px
        );

    line-height:.94;

    letter-spacing:-3.7px;

    font-weight:700;

    max-width:570px;
}

.hero h1 .line{
    display:block;
}

.hero h1 .muted{
    color:#626c79;
}

.hero h1 .gradient{
    background:
        linear-gradient(
            100deg,
            #ffffff 10%,
            #9eeaff 45%,
            #678eff 90%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}


/* =====================================================
   HERO TEXT
===================================================== */

.hero-text{
    max-width:410px;

    margin-top:24px;

    color:var(--muted);

    font-size:12px;

    line-height:1.85;
}


/* =====================================================
   HERO CTA
===================================================== */

.hero-cta{
    width:min(100%,390px);

    margin-top:31px;

    display:flex;
    align-items:center;
    justify-content:center;

    min-height:62px;

    border-radius:17px;

    text-decoration:none;

    color:#031018;

    font-size:12px;
    font-weight:800;

    background:
        linear-gradient(
            105deg,
            #7deaff,
            #3fc1ff 48%,
            #7184ff
        );

    box-shadow:
        0 18px 55px
        rgba(45,174,255,.22),

        inset 0 1px 0
        rgba(255,255,255,.6);

    transition:.25s ease;
}

.hero-cta:hover{
    transform:translateY(-3px);

    box-shadow:
        0 24px 70px
        rgba(45,174,255,.32);
}


/* =====================================================
   HERO META
===================================================== */

.hero-meta{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:15px;

    margin-top:17px;

    color:#4e5866;

    font-size:8px;

    letter-spacing:.5px;
}

.meta-divider{
    width:1px;
    height:12px;

    background:#252c35;
}

.live{
    display:flex;
    align-items:center;
    gap:5px;
}

.live-dot{
    width:5px;
    height:5px;

    border-radius:50%;

    background:#5de6a8;

    box-shadow:
        0 0 9px #5de6a8;
}


/* =====================================================
   SECTION COMMON
===================================================== */

section{
    position:relative;
}

.section{
    padding:100px 0;
}

.section-label{
    font-size:8px;

    color:#667180;

    letter-spacing:2.4px;

    text-transform:uppercase;

    margin-bottom:17px;
}

.section-title{
    font-family:"Space Grotesk",sans-serif;

    font-size:
        clamp(
            29px,
            8vw,
            42px
        );

    line-height:1.05;

    letter-spacing:-1.8px;

    font-weight:600;
}

.section-title span{
    color:#626c79;
}


/* =====================================================
   COMMUNITY INTRO
===================================================== */

.community-intro{
    padding-top:50px;
}

.community-copy{
    color:#737d8a;

    font-size:12px;

    line-height:1.85;

    max-width:450px;

    margin-top:22px;
}


/* =====================================================
   BIG VISUAL
===================================================== */

.visual{
    margin-top:42px;

    height:360px;

    border-radius:30px;

    position:relative;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(56,190,255,.15),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #0a1018,
            #040609
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    box-shadow:
        0 35px 90px
        rgba(0,0,0,.38);
}

.visual-grid{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:38px 38px;

    transform:
        perspective(400px)
        rotateX(55deg)
        scale(1.6);

    transform-origin:center bottom;

    opacity:.45;
}

.visual-orb{
    position:absolute;

    width:180px;
    height:180px;

    left:50%;
    top:43%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            rgba(175,245,255,.9),
            rgba(46,160,255,.22) 28%,
            rgba(55,90,255,.05) 55%,
            transparent 70%
        );

    box-shadow:
        0 0 100px
        rgba(55,190,255,.17);
}

.visual-orbit{
    position:absolute;

    width:270px;
    height:90px;

    left:50%;
    top:43%;

    transform:
        translate(-50%,-50%)
        rotate(-20deg);

    border-radius:50%;

    border:
        1px solid
        rgba(91,215,255,.22);
}

.visual-orbit.two{
    transform:
        translate(-50%,-50%)
        rotate(35deg);

    border-color:
        rgba(116,102,255,.16);
}

.visual-text{
    position:absolute;

    bottom:22px;
    left:23px;

    font-family:"Space Grotesk",sans-serif;

    font-size:9px;

    color:#687585;

    letter-spacing:2px;

    text-transform:uppercase;
}


/* =====================================================
   FEATURE LIST
===================================================== */

.features{
    margin-top:45px;
}

.feature{
    display:grid;

    grid-template-columns:
        42px
        1fr;

    gap:14px;

    padding:
        22px 0;

    border-top:
        1px solid
        rgba(255,255,255,.07);
}

.feature:last-child{
    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}

.feature-number{
    font-family:"Space Grotesk",sans-serif;

    font-size:9px;

    color:#3e4753;

    padding-top:2px;
}

.feature h3{
    font-size:13px;

    color:#e2e8ef;

    font-weight:700;

    margin-bottom:6px;
}

.feature p{
    font-size:10px;

    color:#687382;

    line-height:1.65;

    max-width:390px;
}


/* =====================================================
   HOW IT WORKS
===================================================== */

.steps-section{
    padding-top:75px;
}

.steps{
    margin-top:40px;

    display:grid;

    gap:12px;
}

.step{
    position:relative;

    min-height:135px;

    padding:20px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(16,22,31,.82),
            rgba(7,10,15,.72)
        );

    border:
        1px solid
        rgba(255,255,255,.065);

    overflow:hidden;
}

.step::after{
    content:"";

    position:absolute;

    width:110px;
    height:110px;

    right:-55px;
    top:-55px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(70,194,255,.10),
            transparent 65%
        );
}

.step-num{
    color:#63dfff;

    font-family:"Space Grotesk",sans-serif;

    font-size:9px;

    letter-spacing:1.5px;

    margin-bottom:25px;
}

.step h3{
    font-size:14px;

    color:#e4ebf3;

    margin-bottom:6px;
}

.step p{
    color:#687483;

    font-size:9px;

    line-height:1.65;

    max-width:410px;
}


/* =====================================================
   SOCIAL PROOF
===================================================== */

.proof{
    padding:100px 0 85px;

    text-align:center;
}

.proof-number{
    font-family:"Space Grotesk",sans-serif;

    font-size:
        clamp(
            55px,
            18vw,
            90px
        );

    line-height:1;

    letter-spacing:-5px;

    background:
        linear-gradient(
            100deg,
            #ffffff,
            #65dfff,
            #7287ff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.proof-label{
    color:#66717e;

    font-size:9px;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-top:10px;
}

.proof-copy{
    max-width:380px;

    margin:18px auto 0;

    color:#707b89;

    font-size:11px;

    line-height:1.75;
}


/* =====================================================
   FINAL CTA
===================================================== */

.final{
    margin-bottom:22px;

    min-height:390px;

    padding:27px;

    border-radius:30px;

    position:relative;

    overflow:hidden;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    background:
        radial-gradient(
            circle at 90% 10%,
            rgba(60,180,255,.16),
            transparent 30%
        ),
        radial-gradient(
            circle at 20% 100%,
            rgba(104,87,255,.08),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #0d131b,
            #05070a
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.42);
}

.final::before{
    content:"";

    position:absolute;

    width:300px;
    height:300px;

    right:-180px;
    bottom:-190px;

    border-radius:50%;

    border:
        1px solid
        rgba(80,205,255,.12);
}

.final-label{
    color:#65717f;

    font-size:8px;

    letter-spacing:2px;

    text-transform:uppercase;
}

.final h2{
    position:relative;
    z-index:2;

    font-family:"Space Grotesk",sans-serif;

    font-size:
        clamp(
            35px,
            11vw,
            52px
        );

    line-height:.98;

    letter-spacing:-2.5px;
}

.final h2 span{
    color:#687382;
}

.final-button{
    position:relative;
    z-index:5;

    width:100%;

    min-height:61px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:
        0 10px
        0 19px;

    border-radius:16px;

    text-decoration:none;

    color:#031018;

    background:
        linear-gradient(
            105deg,
            #7deaff,
            #42c1ff 48%,
            #7184ff
        );

    font-size:11px;

    font-weight:800;

    box-shadow:
        0 15px 45px
        rgba(44,173,255,.20),

        inset 0 1px 0
        rgba(255,255,255,.6);

    transition:.25s ease;
}

.final-button:hover{
    transform:translateY(-3px);

    box-shadow:
        0 22px 60px
        rgba(44,173,255,.30);
}

.final-arrow{
    width:41px;
    height:41px;

    display:grid;
    place-items:center;

    border-radius:13px;

    background:
        rgba(0,0,0,.12);

    font-size:17px;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    padding:
        12px 0
        30px;

    text-align:center;

    color:#343d49;

    font-size:7px;

    letter-spacing:1.7px;

    text-transform:uppercase;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:430px){

    .container{
        padding-left:14px;
        padding-right:14px;
    }

    header{
        height:68px;
    }

    .hero{
        min-height:720px;
        padding-top:40px;
    }

    .hero h1{
        font-size:46px;
        letter-spacing:-3.4px;
    }

    .hero-text{
        max-width:315px;
    }

    .logo-box{
        width:125px;
        height:125px;
    }

    .logo-ring{
        width:125px;
        height:125px;
    }

    .logo{
        width:99px;
        height:99px;
    }

    .visual{
        height:300px;
    }

    .section{
        padding:80px 0;
    }

}

@media(max-width:360px){

    .hero h1{
        font-size:42px;
        letter-spacing:-3px;
    }

    .hero{
        min-height:690px;
    }

    .final{
        padding:23px;
    }

    .final h2{
        font-size:34px;
    }

}

</style>
</head>
